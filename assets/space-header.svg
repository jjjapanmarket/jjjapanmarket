<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280">
  <defs>
    <clipPath id="frame"><rect width="1000" height="280"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <!-- flat dark background -->
    <rect width="1000" height="280" fill="#17191D"/>

    <!-- stars: dots -->
    <g fill="#FFFFFF">
      <circle cx="60" cy="45" r="1.5"><animate attributeName="opacity" values="1;0.2;1" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="150" cy="110" r="1.1"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.3s" repeatCount="indefinite"/></circle>
      <circle cx="235" cy="55" r="1.3"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="320" cy="150" r="1.0"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.0s" repeatCount="indefinite"/></circle>
      <circle cx="405" cy="40" r="1.4"><animate attributeName="opacity" values="1;0.2;1" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="490" cy="120" r="1.1"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.5s" repeatCount="indefinite"/></circle>
      <circle cx="575" cy="60" r="1.3"><animate attributeName="opacity" values="1;0.4;1" dur="2.2s" repeatCount="indefinite"/></circle>
      <circle cx="655" cy="140" r="1.0"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.9s" repeatCount="indefinite"/></circle>
      <circle cx="740" cy="45" r="1.4"><animate attributeName="opacity" values="1;0.3;1" dur="3.1s" repeatCount="indefinite"/></circle>
      <circle cx="945" cy="120" r="1.2"><animate attributeName="opacity" values="1;0.3;1" dur="2.5s" repeatCount="indefinite"/></circle>
      <circle cx="95" cy="185" r="1.2"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.7s" repeatCount="indefinite"/></circle>
      <circle cx="880" cy="200" r="1.1"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.2s" repeatCount="indefinite"/></circle>
      <circle cx="530" cy="180" r="0.9"><animate attributeName="opacity" values="1;0.4;1" dur="2.3s" repeatCount="indefinite"/></circle>
      <circle cx="300" cy="90" r="0.9"><animate attributeName="opacity" values="0.5;1;0.5" dur="2.1s" repeatCount="indefinite"/></circle>
    </g>

    <!-- stars: sparkles (4-point) -->
    <g fill="#FFFFFF">
      <path d="M 200 160 l 2.2 5.8 5.8 2.2 -5.8 2.2 -2.2 5.8 -2.2 -5.8 -5.8 -2.2 5.8 -2.2 Z" opacity="0.9">
        <animate attributeName="opacity" values="0.9;0.2;0.9" dur="3.4s" repeatCount="indefinite"/>
      </path>
      <path d="M 830 60 l 2.2 5.8 5.8 2.2 -5.8 2.2 -2.2 5.8 -2.2 -5.8 -5.8 -2.2 5.8 -2.2 Z" opacity="0.8">
        <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.8s" repeatCount="indefinite"/>
      </path>
      <path d="M 620 100 l 1.8 4.7 4.7 1.8 -4.7 1.8 -1.8 4.7 -1.8 -4.7 -4.7 -1.8 4.7 -1.8 Z" opacity="0.7">
        <animate attributeName="opacity" values="0.8;0.2;0.8" dur="2.5s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- comet streaks -->
    <g stroke="#8A8F96" stroke-width="2" stroke-linecap="round">
      <line x1="900" y1="35" x2="930" y2="25"/>
      <circle cx="900" cy="35" r="2.4" fill="#C8CCD1" stroke="none"/>
      <line x1="70" y1="130" x2="95" y2="122"/>
      <circle cx="70" cy="130" r="2" fill="#C8CCD1" stroke="none"/>
    </g>

    <!-- saturn-like planet (flat gray) -->
    <g transform="translate(875 95)">
      <circle r="34" fill="#4A4F56"/>
      <circle cx="-10" cy="-8" r="5" fill="#33373D"/>
      <circle cx="12" cy="8" r="7" fill="#33373D"/>
      <ellipse rx="54" ry="10" fill="none" stroke="#C8CCD1" stroke-width="4" transform="rotate(-16)" opacity="0.9"/>
    </g>

    <!-- small moon -->
    <g transform="translate(120 70)">
      <circle r="18" fill="#3A3E44"/>
      <circle cx="-5" cy="-4" r="4" fill="#2C3036"/>
      <circle cx="7" cy="5" r="3" fill="#2C3036"/>
    </g>

    <!-- moon horizon at bottom -->
    <g>
      <ellipse cx="500" cy="430" rx="640" ry="185" fill="#DDDBD3"/>
      <ellipse cx="260" cy="268" rx="26" ry="9" fill="#C4C2BA"/>
      <ellipse cx="480" cy="272" rx="34" ry="10" fill="#C4C2BA"/>
      <ellipse cx="700" cy="266" rx="22" ry="8" fill="#C4C2BA"/>
    </g>

    <!-- rocket (flat style) flying up-right -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="790 165; 796 157; 790 165" dur="4s" repeatCount="indefinite"/>
      <g transform="rotate(42)">
        <!-- smoke trail -->
        <path d="M -7 30 Q 0 60 -14 96 Q 4 70 7 30 Z" fill="#5A5F66" opacity="0.55"/>
        <!-- flame -->
        <path d="M -6 24 Q 0 48 0 52 Q 0 48 6 24 Z" fill="#FF9F1C">
          <animate attributeName="opacity" values="1;0.6;1" dur="0.5s" repeatCount="indefinite"/>
        </path>
        <!-- body -->
        <path d="M -13 24 L -13 -8 Q -13 -32 0 -42 Q 13 -32 13 -8 L 13 24 Z" fill="#F2F0EA"/>
        <!-- nose stripe -->
        <path d="M 0 -42 Q 13 -32 13 -8 L 13 -20 Q 10 -34 0 -42 Z" fill="#F2545B"/>
        <!-- window -->
        <circle cy="-8" r="7.5" fill="#2A2D33" stroke="#C8CCD1" stroke-width="2.5"/>
        <!-- fins -->
        <path d="M -13 6 L -26 30 L -13 24 Z" fill="#F2545B"/>
        <path d="M 13 6 L 26 30 L 13 24 Z" fill="#F2545B"/>
      </g>
    </g>

    <!-- title -->
    <text x="500" y="115" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="46" font-weight="bold" fill="#FFFFFF">Hi, I'm JJJ</text>
    <text x="500" y="158" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#9BA1A6">Android Developer &#160;|&#160; Kotlin · Jetpack Compose</text>
  </g>
</svg>
